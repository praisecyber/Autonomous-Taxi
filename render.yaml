services:
  - type: web
    name: probix-taxi
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install .
    startCommand: bash deploy/start-render.sh
    healthCheckPath: /api/health
    autoDeployTrigger: off
    disk:
      name: probix-taxi-data
      mountPath: /var/data/taxi
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TAXI_DEPLOYMENT
        value: production
      - key: TAXI_MODE
        value: simulation
      - key: TAXI_DATA_DIR
        value: /var/data/taxi
      - key: TAXI_SECURE_COOKIES
        value: '1'
      - key: TAXI_ALLOW_LEGACY_TOKEN
        value: '0'
      - key: TAXI_BOOTSTRAP_NEW_DATABASE
        value: '0'
